# Bonus experiment: extra loopback source addresses.
#
# Append to /etc/rc.conf to make these survive a reboot:
#     cat bonus/rc.conf | sudo tee -a /etc/rc.conf
#     sudo service netif restart
#
# WHY THIS IS REQUIRED ON FREEBSD (and not on Linux):
#
# One source IP can hold only as many outbound connections to a single
# destination as it has ephemeral ports -- net.inet.ip.portrange is
# 10000-65535 by default, so ~55,535. That is short of 70,000 on its own,
# so more than one source address is genuinely required.
#
# Note this is about SIMULTANEOUS ports, not TIME_WAIT: FreeBSD ships
# net.inet.tcp.nolocaltimewait=1, which skips TIME_WAIT entirely when both
# endpoints are on the same host (no network for duplicate segments to
# wander in, so the state buys nothing). Measured in Experiment 2: a closed
# loopback connection disappears from netstat immediately rather than
# lingering for 2*MSL. Ports are therefore reusable straight away.
#
# Binding across several source addresses gives each its own independent
# ephemeral pool. But lo0 owns ONLY 127.0.0.1 -- its 0xff000000 netmask does
# NOT make the rest of 127.0.0.0/8 local. An unaliased 127.0.0.2 falls
# through to the default route (we saw it resolve to gateway 10.0.2.2 via
# em0), so bind() fails with EADDRNOTAVAIL. Linux does bind the whole /8 to
# lo and needs none of this; FreeBSD requires explicit aliases.
#
# Symptom if these are missing: client_generator reports an exact 50/50
# connected/failed split with 2 source IPs, because it alternates addresses
# round-robin and every attempt on the unaliased address fails.
#
# NOTE: alias numbering must start at 0 and be consecutive -- rc(8) stops
# processing at the first gap.

ifconfig_lo0_alias0="inet 127.0.0.2 netmask 255.255.255.255"
ifconfig_lo0_alias1="inet 127.0.0.3 netmask 255.255.255.255"
ifconfig_lo0_alias2="inet 127.0.0.4 netmask 255.255.255.255"
ifconfig_lo0_alias3="inet 127.0.0.5 netmask 255.255.255.255"
