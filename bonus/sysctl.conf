# Bonus experiment: 70,000 concurrent idle connections on FreeBSD.
#
# Append to /etc/sysctl.conf to make these survive a reboot:
#     cat bonus/sysctl.conf | sudo tee -a /etc/sysctl.conf
#     sudo service sysctl reload
#
# Both the Exchange Server and client_generator run on the SAME host here
# (loopback only), so every connection costs TWO file descriptors and TWO
# socket structures system-wide -- 70,000 connections needs ~140,000 of each.
# That is what these numbers are sized for.

# System-wide open file ceiling. Must cover both processes at once:
# 70,008 (server) + 70,007 (generator) + system baseline ~= 140,100.
kern.maxfiles=200000

# Per-process ceiling. This is also what a login session's hard RLIMIT_NOFILE
# resolves to for the default login class, so raising it is what lets
# exchange_server's own setrlimit(RLIMIT_NOFILE, rlim_max) reach past the
# stock 57,987. Applies to new sessions -- an already-running process keeps
# the ceiling it inherited at start.
kern.maxfilesperproc=100000

# Ceiling on the "socket" UMA zone. At 70,000 connections we measured
# 140,026 sockets in use, so 200,000 leaves ~30% headroom.
kern.ipc.maxsockets=200000

# Max value listen(2) may request as its backlog. exchange_server asks for
# 1024 (kBacklog); with the stock 128 here the kernel silently clamps it.
# FreeBSD additionally allows the queue to reach 3/2 * backlog before
# sonewconn() starts dropping -- we observed overflow logged at exactly 1537.
kern.ipc.soacceptqueue=1024
